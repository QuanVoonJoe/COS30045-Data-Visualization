<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4.1: SVG Customisation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>Exercise 4.1: My Custom SVG House</h1>
  <div class="subtitle">Comparing the standard primitives with a customised scene</div>

  <!-- PART 1: LIVE SVGs -->
  <div class="comparison-container">
    
    <!-- BEFORE CARD -->
    <div class="card">
      <h2>Initial Design (Before)</h2>
      <div class="media-wrapper">
        <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
          <rect width="500" height="500" fill="skyblue" />
          <rect y="300" width="500" height="200" fill="forestgreen" />
          <circle cx="400" cy="100" r="40" fill="yellow" />
          <line x1="80" y1="200" x2="80" y2="350" stroke="saddlebrown" stroke-width="20" />
          <circle cx="60" cy="220" r="30" fill="darkgreen" />
          <circle cx="100" cy="220" r="30" fill="darkgreen" />
          <circle cx="80" cy="190" r="35" fill="darkgreen" />
          <rect x="150" y="180" width="180" height="120" fill="chocolate" />
          <polygon points="130,180 240,100 350,180" fill="saddlebrown" />
          <rect x="210" y="240" width="35" height="60" fill="maroon" />
          <circle cx="238" cy="275" r="3" fill="black" />
          <g fill="lightblue" stroke="white" stroke-width="3">
            <rect width="30" height="30" transform="translate(170, 200)" />
            <rect width="30" height="30" transform="translate(280, 200)" />
          </g>
          <path d="M 225 300 Q 180 400 250 500" stroke="gold" stroke-width="5" fill="none" />
          <path d="M 245 300 Q 200 400 270 500" stroke="gold" stroke-width="5" fill="none" />
          <text x="350" y="280" font-family="Arial" font-size="20" fill="black">House</text>
        </svg>
      </div>
    </div>

    <!-- AFTER CARD -->
    <div class="card">
      <h2>Customised Design (After)</h2>
      <div class="media-wrapper">
        <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
          <rect width="500" height="500" fill="midnightblue" />
          <circle cx="100" cy="50" r="2" fill="white" />
          <circle cx="250" cy="90" r="1.5" fill="white" />
          <circle cx="380" cy="40" r="2" fill="white" />
          <circle cx="420" cy="80" r="35" fill="lemonchiffon" />
          <rect y="300" width="500" height="200" fill="darkolivegreen" />
          <ellipse cx="400" cy="380" rx="70" ry="25" fill="teal" stroke="darkslategray" stroke-width="3" />
          <line x1="90" y1="200" x2="90" y2="330" stroke="saddlebrown" stroke-width="15" />
          <polygon points="40,260 90,160 140,260" fill="forestgreen" />
          <polygon points="50,200 90,110 130,200" fill="forestgreen" />
          <rect x="180" y="160" width="160" height="140" fill="peru" stroke="maroon" stroke-width="2" />
          <polygon points="160,160 260,70 360,160" fill="darkred" stroke="maroon" stroke-width="2" />
          <rect x="240" y="230" width="40" height="70" fill="sienna" />
          <circle cx="272" cy="265" r="4" fill="gold" />
          <g fill="khaki" stroke="saddlebrown" stroke-width="4">
            <rect width="35" height="35" transform="translate(195, 185)" />
            <rect width="35" height="35" transform="translate(290, 185)" />
          </g>
          <path d="M 260 300 Q 320 400 230 500" stroke="darkkhaki" stroke-width="30" fill="none" />
          <polyline points="330,370 340,340 350,375 360,335 370,370" fill="none" stroke="mediumseagreen" stroke-width="2" />
          <text x="20" y="40" font-family="sans-serif" font-size="18" fill="lightgray">Night Cabin</text>
        </svg>
      </div>
    </div>
  </div>

  <!-- PART 2: ANNOTATED SCREENSHOTS -->
  <div class="section-title">Step 2: Coordinate Annotations</div>
  <div class="comparison-container">
    
    <!-- BEFORE IMAGE CARD -->
    <div class="card">
      <h2>Annotated Initial Design (Before)</h2>
      <div class="media-wrapper">
        <img src="images/Before.png" alt="Coordinate Annotations Before">
      </div>
    </div>

    <!-- AFTER IMAGE CARD -->
    <div class="card">
      <h2>Annotated Customised Design (After)</h2>
      <div class="media-wrapper">
        <img src="images/After.png" alt="Coordinate Annotations After">
      </div>
    </div>

  </div>

</body>
</html>
